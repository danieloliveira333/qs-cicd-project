name: AI Quality Gate

# 🤖 Este workflow corre APENAS quando alguém abre ou atualiza um Pull Request
on:
  pull_request:
    branches: [ main ]

# Permissões necessárias para comentar no PR
permissions:
  contents: read
  pull-requests: write

jobs:
  ai-quality-gate:
    name: AI Code Review (Gemini)
    runs-on: ubuntu-latest

    steps:

      # Passo 1: Download do código
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Precisamos do histórico completo para o diff

      # Passo 2: Instalar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Passo 3: Obter o diff do PR (o código que foi alterado)
      - name: Get PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff origin/main...HEAD > pr_diff.txt
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          cat pr_diff.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Diff captured: $(wc -l < pr_diff.txt) lines"

      # Passo 4: Correr o AI Quality Gate
      - name: Run AI Quality Gate
        id: ai_gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_DIFF: ${{ env.PR_DIFF }}
        run: python ai_quality_gate.py
        continue-on-error: true    # Continua para poder comentar no PR mesmo se rejeitar

      # Passo 5: Publicar o comentário da IA no PR
      - name: Post AI review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment;
            try {
              comment = fs.readFileSync('ai_gate_comment.md', 'utf8');
            } catch (e) {
              comment = '## ⚠️ AI Quality Gate\nFailed to generate review. Check the logs.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      # Passo 6: Falhar o pipeline se a IA rejeitou
      - name: Check AI gate decision
        run: |
          DECISION=$(cat ai_gate_decision.txt 2>/dev/null || echo "REJECTED")
          echo "Decision: $DECISION"
          if [ "$DECISION" = "REJECTED" ]; then
            echo "❌ AI Quality Gate REJECTED this PR."
            exit 1
          else
            echo "✅ AI Quality Gate APPROVED this PR."
          fi
