name: CI Pipeline - QS Project

# 🤖 Quando é que o robô acorda?
on:
  push:
    branches: [ main ]        # Quando alguém faz push para o main
  pull_request:
    branches: [ main ]        # Quando alguém abre um Pull Request para o main

jobs:

  # ── JOB 1: Correr os testes ──────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest    # O robô usa uma máquina Linux

    steps:

      # Passo 1: Fazer download do código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Instalar o Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Passo 3: Instalar as dependências (pytest, etc.)
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Passo 4: Correr os testes e medir a cobertura
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing tests/

      # Passo 5: Guardar o relatório de cobertura como artefacto
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── JOB 2: Verificar qualidade do código ─────────────────────────────
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      # Verifica se o código segue boas práticas (sem erros de estilo)
      - name: Run flake8 linter
        run: flake8 src/ tests/ --max-line-length=100
